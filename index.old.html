<!DOCTYPE html><html><head><meta charset="utf-8">
<title>Racing</title>
<style>
*{margin:0;overflow:hidden}
canvas{display:block}
#h{position:fixed;top:10px;left:10px;color:#fff;font:bold 24px monospace;text-shadow:2px 2px #000}
#m{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font:bold 48px monospace;text-shadow:3px 3px #000;display:none;text-align:center;line-height:1.5}
</style>
</head><body>
<canvas id="c"></canvas>
<div id="h"></div>
<div id="m"></div>
<script>
const C=document.getElementById('c'),gl=C.getContext('webgl'),H=document.getElementById('h'),M=document.getElementById('m');
if(!gl){document.body.textContent='WebGL not supported';throw 0;}

function resize(){C.width=innerWidth;C.height=innerHeight;gl.viewport(0,0,C.width,C.height);}
addEventListener('resize',resize);resize();

// Shaders
const VS=`attribute vec3 p,c;uniform mat4 v;varying vec3 C,W;void main(){gl_Position=v*vec4(p,1);C=c;W=p;}`;
const FS=`precision mediump float;varying vec3 C,W;uniform float s;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f*=f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
void main(){vec3 c=C;float L=C.r*.3+C.g*.59+C.b*.11;
if(W.y<.015){vec2 t=vec2(W.x,W.z+s);float v=n(t*3.)*.5+n(t*7.)*.25+n(t*13.)*.125;
if(abs(W.x)<9.){c=vec3(.18+v*.15,.18+v*.14,.2+v*.14);float cr=n(t*vec2(.8,15.));if(cr>.82)c*=.65;}
else{float g=n(t*2.)*.3;c=vec3(.1+g*.3,.28+v*.25+g*.15,.06+g*.1);}}
else if(L<.1){vec2 wp=W.xz*8.;c=vec3(.04+n(wp*vec2(3.,12.))*.08);}
else if(C.b>C.r*1.5&&L<.25){vec2 wp=W.xz*5.;c=C+vec3(.03,.05,.1)*n(wp);}
else if(W.y>.02){vec2 wp=W.xz*10.;c=C*(1.+n(wp*3.)*.15+n(wp*8.)*.08);}
gl_FragColor=vec4(c,1);}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o;}
const P=gl.createProgram();
gl.attachShader(P,sh(gl.VERTEX_SHADER,VS));
gl.attachShader(P,sh(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(P);gl.useProgram(P);
const ap=gl.getAttribLocation(P,'p'),ac=gl.getAttribLocation(P,'c'),uv=gl.getUniformLocation(P,'v'),us=gl.getUniformLocation(P,'s');
gl.enableVertexAttribArray(ap);gl.enableVertexAttribArray(ac);
const B=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,B);
gl.vertexAttribPointer(ap,3,gl.FLOAT,false,24,0);
gl.vertexAttribPointer(ac,3,gl.FLOAT,false,24,12);
gl.enable(gl.DEPTH_TEST);
gl.clearColor(0.5,0.75,1,1);

// Mat4 (column-major)
function persp(fov,a,n,f){const t=1/Math.tan(fov/2),d=1/(n-f);return new Float32Array([t/a,0,0,0,0,t,0,0,0,0,(f+n)*d,-1,0,0,2*f*n*d,0]);}
function look(e,t,u){
  let zx=e[0]-t[0],zy=e[1]-t[1],zz=e[2]-t[2],l=1/Math.sqrt(zx*zx+zy*zy+zz*zz);
  zx*=l;zy*=l;zz*=l;
  let xx=u[1]*zz-u[2]*zy,xy=u[2]*zx-u[0]*zz,xz=u[0]*zy-u[1]*zx;
  l=1/Math.sqrt(xx*xx+xy*xy+xz*xz);xx*=l;xy*=l;xz*=l;
  const yx=zy*xz-zz*xy,yy=zz*xx-zx*xz,yz=zx*xy-zy*xx;
  return new Float32Array([xx,yx,zx,0,xy,yy,zy,0,xz,yz,zz,0,
    -(xx*e[0]+xy*e[1]+xz*e[2]),-(yx*e[0]+yy*e[1]+yz*e[2]),-(zx*e[0]+zy*e[1]+zz*e[2]),1]);
}
function mul(a,b){const o=new Float32Array(16);for(let i=0;i<4;i++)for(let j=0;j<4;j++)for(let k=0;k<4;k++)o[j*4+i]+=a[k*4+i]*b[j*4+k];return o;}

// Geometry — each vertex: x,y,z,r,g,b (6 floats). Quad = 2 tris = 36 floats
const VB=new Float32Array(350000); // ponytail: detailed cars + particles + effects
let vi;
function q(x1,y1,z1,x2,y2,z2,x3,y3,z3,x4,y4,z4,r,g,b){
  const d=[x1,y1,z1,r,g,b,x2,y2,z2,r,g,b,x3,y3,z3,r,g,b,x1,y1,z1,r,g,b,x3,y3,z3,r,g,b,x4,y4,z4,r,g,b];
  for(let i=0;i<36;i++)VB[vi++]=d[i];
}
function bx(cx,cy,cz,sx,sy,sz,r,g,b){
  const x=sx/2,y=sy/2,z=sz/2;
  q(cx-x,cy-y,cz+z,cx+x,cy-y,cz+z,cx+x,cy+y,cz+z,cx-x,cy+y,cz+z, r,g,b);
  q(cx+x,cy-y,cz-z,cx-x,cy-y,cz-z,cx-x,cy+y,cz-z,cx+x,cy+y,cz-z, r*.8,g*.8,b*.8);
  q(cx-x,cy+y,cz+z,cx+x,cy+y,cz+z,cx+x,cy+y,cz-z,cx-x,cy+y,cz-z, r*.9,g*.9,b*.9);
  q(cx-x,cy-y,cz-z,cx+x,cy-y,cz-z,cx+x,cy-y,cz+z,cx-x,cy-y,cz+z, r*.6,g*.6,b*.6);
  q(cx+x,cy-y,cz+z,cx+x,cy-y,cz-z,cx+x,cy+y,cz-z,cx+x,cy+y,cz+z, r*.85,g*.85,b*.85);
  q(cx-x,cy-y,cz-z,cx-x,cy-y,cz+z,cx-x,cy+y,cz+z,cx-x,cy+y,cz-z, r*.75,g*.75,b*.75);
}
function car(cx,cz,r,g,b,d){
  if(!d)d=1;const w=.85,l=1.9,Z=v=>cz+v*d;
  const R=r,G=g,B=b; // body color
  const dr=R*.65,dg=G*.65,db=B*.65; // dark accent

  // Main body
  bx(cx,.245,cz,w*2,.45,l*2, R,G,B);
  // Hood slope (front)
  q(cx-w,.48,Z(-l), cx+w,.48,Z(-l), cx+.65,.58,Z(-.7), cx-.65,.58,Z(-.7), R*.95,G*.95,B*.95);
  // Trunk slope (rear)
  q(cx-.65,.58,Z(.6), cx+.65,.58,Z(.6), cx+w,.48,Z(l), cx-w,.48,Z(l), R*.9,G*.9,B*.9);
  // Cabin sides
  q(cx-.65,.58,Z(-.7), cx-.6,1.0,Z(-.4), cx-.6,1.0,Z(.35), cx-.65,.58,Z(.6), dr,dg,db);
  q(cx+.65,.58,Z(.6), cx+.6,1.0,Z(.35), cx+.6,1.0,Z(-.4), cx+.65,.58,Z(-.7), dr*.95,dg*.95,db*.95);
  // Roof
  q(cx-.6,1.0,Z(-.4), cx+.6,1.0,Z(-.4), cx+.6,1.0,Z(.35), cx-.6,1.0,Z(.35), R*.82,G*.82,B*.82);
  // Windshield (front)
  q(cx+.65,.58,Z(-.7), cx-.65,.58,Z(-.7), cx-.6,1.0,Z(-.4), cx+.6,1.0,Z(-.4), .12,.17,.32);
  // Rear window
  q(cx-.65,.58,Z(.6), cx+.65,.58,Z(.6), cx+.6,1.0,Z(.35), cx-.6,1.0,Z(.35), .1,.14,.28);
  // Side windows
  q(cx-.66,.65,Z(-.6), cx-.61,.95,Z(-.35), cx-.61,.95,Z(.28), cx-.66,.65,Z(.5), .1,.15,.28);
  q(cx+.66,.65,Z(.5), cx+.61,.95,Z(.28), cx+.61,.95,Z(-.35), cx+.66,.65,Z(-.6), .1,.15,.28);

  // Wheels (4)
  bx(cx-.72,.17,Z(-1.15),.28,.30,.6,.06,.06,.06);bx(cx+.72,.17,Z(-1.15),.28,.30,.6,.06,.06,.06);
  bx(cx-.72,.17,Z(1.15),.28,.30,.6,.06,.06,.06);bx(cx+.72,.17,Z(1.15),.28,.30,.6,.06,.06,.06);
  // Wheel arches (dark accent strips over wheels)
  bx(cx-.78,.35,Z(-1.15),.12,.06,.7, dr*.5,dg*.5,db*.5);
  bx(cx+.78,.35,Z(-1.15),.12,.06,.7, dr*.5,dg*.5,db*.5);
  bx(cx-.78,.35,Z(1.15),.12,.06,.7, dr*.5,dg*.5,db*.5);
  bx(cx+.78,.35,Z(1.15),.12,.06,.7, dr*.5,dg*.5,db*.5);

  // Front bumper
  bx(cx,.2,Z(-l-.08),w*2-.1,.22,.15, dr,dg,db);
  // Rear bumper
  bx(cx,.2,Z(l+.08),w*2-.1,.22,.15, dr,dg,db);
  // Side skirts
  bx(cx-.82,.08,cz,.06,.12,l*1.6, dr*.7,dg*.7,db*.7);
  bx(cx+.82,.08,cz,.06,.12,l*1.6, dr*.7,dg*.7,db*.7);

  // Grille (front face, dark)
  q(cx-.5,.2,Z(-l-.09), cx+.5,.2,Z(-l-.09), cx+.5,.4,Z(-l-.09), cx-.5,.4,Z(-l-.09), .05,.05,.05);
  // Headlights
  q(cx+.6,.3,Z(-l-.1),cx+.35,.3,Z(-l-.1),cx+.35,.43,Z(-l-.1),cx+.6,.43,Z(-l-.1), 1,.95,.5);
  q(cx-.35,.3,Z(-l-.1),cx-.6,.3,Z(-l-.1),cx-.6,.43,Z(-l-.1),cx-.35,.43,Z(-l-.1), 1,.95,.5);
  // Taillights
  q(cx-.6,.28,Z(l+.1),cx-.35,.28,Z(l+.1),cx-.35,.43,Z(l+.1),cx-.6,.43,Z(l+.1), .9,.05,.05);
  q(cx+.35,.28,Z(l+.1),cx+.6,.28,Z(l+.1),cx+.6,.43,Z(l+.1),cx+.35,.43,Z(l+.1), .9,.05,.05);
  // Reverse lights (small white)
  q(cx-.2,.28,Z(l+.1),cx-.05,.28,Z(l+.1),cx-.05,.36,Z(l+.1),cx-.2,.36,Z(l+.1), .9,.9,.85);
  q(cx+.05,.28,Z(l+.1),cx+.2,.28,Z(l+.1),cx+.2,.36,Z(l+.1),cx+.05,.36,Z(l+.1), .9,.9,.85);

  // Side mirrors
  bx(cx-.72,.72,Z(-.5),.08,.08,.12, dr,dg,db);
  bx(cx+.72,.72,Z(-.5),.08,.08,.12, dr,dg,db);
  // Exhaust pipes (rear bottom)
  bx(cx-.3,.06,Z(l+.14),.08,.06,.06, .2,.2,.2);
  bx(cx+.3,.06,Z(l+.14),.08,.06,.06, .2,.2,.2);
  // Spoiler (rear, only on some — use color hash)
  if((R*100|0)%3===0){
    bx(cx,.53,Z(l-.1),.06,.4,.06, dr,dg,db); bx(cx,.53,Z(l-.1)+.06*d,.06,.4,.06, dr,dg,db);
    q(cx-.6,.73,Z(l-.15), cx+.6,.73,Z(l-.15), cx+.6,.76,Z(l+.05), cx-.6,.76,Z(l+.05), dr,dg,db);
  }
}

// Tire smoke + skid sparks
function tireSmoke(cx,cz,n){
  for(let i=0;i<n;i++){
    parts.push({x:cx+(Math.random()-.5)*.6, y:.05, z:cz+(Math.random()-.5)*.5,
      vx:(Math.random()-.5)*.02, vy:.01+Math.random()*.02, vz:(Math.random()-.5)*.01,
      r:.7,g:.7,b:.7, life:15+Math.random()*20, sz:.1+Math.random()*.15});
  }
}
function sparks(cx,cy,cz,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=.05+Math.random()*.1;
    parts.push({x:cx,y:cy,z:cz, vx:Math.cos(a)*s,vy:.02+Math.random()*.05,vz:Math.sin(a)*s,
      r:1,g:.8+Math.random()*.2,b:.2*Math.random(), life:8+Math.random()*12, sz:.03+Math.random()*.04});
  }
}
let shake=0; // screen shake intensity

// Game state
const RW=9,LN=3,LW=RW/LN,RL=200;
const TC=[[.9,.15,.15],[.95,.5,.1],[.95,.85,.1],[.15,.7,.15],[.7,.15,.7],[.1,.6,.9]];
let px=0,ptx=0,spd=.3,dst=0,sc=0,alive=true,traf=[],onc=[],lt=0;
let pvx=0,hp=100;
const parts=[]; // ponytail: flat array of {x,y,z,vx,vy,vz,r,g,b,life}, max ~200
const XC=[[1,.9,.2],[1,.5,.05],[1,.2,.05],[.3,.3,.3],[.15,.15,.15]]; // fire→smoke
function explode(x,y,z,n,force){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,e=Math.random()*Math.PI-.3;
    const s=(.3+Math.random())*force;
    const c=XC[Math.floor(Math.random()*XC.length)];
    parts.push({x,y:y+.3,z,vx:Math.cos(a)*Math.cos(e)*s,vy:Math.sin(e)*s+.08,vz:Math.sin(a)*Math.cos(e)*s,
      r:c[0],g:c[1],b:c[2],life:30+Math.random()*40,sz:.08+Math.random()*.15});
  }
  if(parts.length>200)parts.splice(0,parts.length-200);
}

function laneX(n){return LW/2+n*LW;}        // right side: 1.5, 4.5, 7.5
function oncLaneX(n){return -(LW/2+n*LW);}  // left side: -1.5, -4.5, -7.5
function spawn(){
  const lane=Math.floor(Math.random()*LN),x=laneX(lane),sz=-RL+Math.random()*20;
  if(traf.some(t=>Math.abs(t.x-x)<1&&Math.abs(t.z-sz)<8))return;
  traf.push({x,z:sz,vx:0,vz:0,c:TC[Math.floor(Math.random()*TC.length)],hit:false});
}
function spawnOnc(){
  const lane=Math.floor(Math.random()*LN),x=oncLaneX(lane),sz=-RL+20;
  if(onc.some(t=>Math.abs(t.x-x)<1&&Math.abs(t.z-sz)<20))return;
  onc.push({x,z:sz,vx:0,vz:0,c:TC[Math.floor(Math.random()*TC.length)],hit:false});
}
function reset(){px=ptx=laneX(1);spd=.3;dst=sc=0;alive=true;traf=[];onc=[];lt=0;pvx=0;hp=100;parts.length=0;M.style.display='none';
  for(let i=0;i<4;i++)spawn();
  for(let i=0;i<3;i++)spawnOnc();
}

// Multiplayer — peers map: id → {x,z,spd,hp,color,alive}
const peers=new Map();
let myId=0,myColor=[.12,.35,.9];
const WS_URL=location.protocol==='file:'?'ws://localhost:3000':`ws://${location.host}`;
let ws=null,wsOk=false;
function wsConnect(){
  try{ws=new WebSocket(WS_URL);}catch(e){return;}
  ws.onopen=()=>{wsOk=true;};
  ws.onclose=()=>{wsOk=false;peers.clear();setTimeout(wsConnect,2000);};
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.t==='id'){myId=m.id;myColor=m.color;}
    else if(m.t==='p'){peers.set(m.id,{x:m.x,z:m.z,spd:m.spd,hp:m.hp,color:m.color,alive:m.alive});}
    else if(m.t==='d')peers.delete(m.id);
    else if(m.t==='tr'){
      // Server-authoritative traffic: replace local arrays
      traf.length=0;onc.length=0;
      for(const s of m.s)traf.push({x:s.x,z:s.z,vx:0,vz:0,c:s.c,hit:false});
      for(const s of m.o)onc.push({x:s.x,z:s.z,vx:0,vz:0,c:s.c,hit:false});
    }
  };
}
wsConnect();
let netTick=0;

// Input
const K={};
addEventListener('keydown',e=>{K[e.code]=true;if(!alive&&e.code==='Space')reset();if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();});
addEventListener('keyup',e=>K[e.code]=false);

function frame(now){
  requestAnimationFrame(frame);
  if(!lt)lt=now;
  const dt=Math.min((now-lt)/16.67,3);lt=now;

  if(alive){
    if(K.ArrowLeft||K.KeyA)pvx-=.025*dt;
    if(K.ArrowRight||K.KeyD)pvx+=.025*dt;
    if(K.ArrowUp||K.KeyW)spd=Math.min(spd+.005*dt,1.2);
    if(K.ArrowDown||K.KeyS)spd=Math.max(spd-.015*dt,.15);
    pvx*=.92; // friction
    ptx+=pvx*dt;
    ptx=Math.max(-RW+.8,Math.min(RW-.8,ptx));
    px+=(ptx-px)*.12*dt;
    dst+=spd*dt;sc=Math.floor(dst);
    shake*=.9; // decay shake

    // Tire smoke on hard steering
    if(Math.abs(pvx)>.12&&spd>.4)tireSmoke(px,1.5,2);

    // Traffic positions come from server (t:'tr'), only local collision response
    // ponytail: no local spawn/move when connected, fallback to local when offline
    if(!wsOk){
      for(const t of traf){t.z+=spd*.25*dt+t.vz*dt;t.x+=t.vx*dt;t.vx*=.95;t.vz*=.95;}
      traf=traf.filter(t=>t.z<10&&t.z>-RL&&Math.abs(t.x)<20);
      if(Math.random()<(.02+sc*.00001)*dt&&traf.length<10)spawn();
      for(const t of onc){t.z+=(spd*2+.4)*dt+t.vz*dt;t.x+=t.vx*dt;t.vx*=.95;t.vz*=.95;}
      onc=onc.filter(t=>t.z<10&&t.z>-RL&&Math.abs(t.x)<20);
      if(Math.random()<.015*dt&&onc.length<8)spawnOnc();
    }

    // Car-car physics: traffic pushes each other
    const all=[...traf,...onc];
    for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++){
      const a=all[i],b=all[j],dx=a.x-b.x,dz=a.z-b.z;
      if(Math.abs(dx)<1.7&&Math.abs(dz)<4){
        const sx=dx>0?.15:-.15;a.vx+=sx;b.vx-=sx;
        const sz=dz>0?.08:-.08;a.vz+=sz;b.vz-=sz;
        explode((a.x+b.x)/2,.3,(a.z+b.z)/2,5,.08);
      }
    }

    // Player collision
    for(const t of all){
      const dx=t.x-px,dz=t.z,adx=Math.abs(dx),adz=Math.abs(dz);
      if(adx<1.5&&adz<3.5){ // AABB overlap
        if(!t.hit){
          t.hit=true;
          const isOnc=onc.includes(t);
          const relSpd=isOnc?spd*2+.4:spd*.75;
          const dmg=Math.min(relSpd*30,isOnc?60:25);
          hp-=dmg;
          spd*=isOnc?.2:.7;
          const pushX=dx>0?1:-1;
          t.vx+=pushX*(1+relSpd*.5);
          t.vz+=relSpd*.8;
          pvx+=pushX*-.15*relSpd;
          const cx=(px+t.x)/2,cz=t.z/2;
          explode(cx,.4,cz,isOnc?40:15,isOnc?.25:.12);
          sparks(cx,.2,cz,isOnc?20:8);
          shake+=isOnc?.5:.2;
        }
        // Separation force
        const sep=3.5-adz;
        if(adz>0)t.vz+=(dz<0?-1:1)*sep*.05;
        if(adx<1.5){const sx=(dx>0?1:-1)*(.06*(1.5-adx));t.vx+=sx;pvx-=sx*.3;}
      } else t.hit=false;
    }

    if(hp<=0){
      alive=false;hp=0;
      explode(px,.5,0,60,.35); // big death explosion
      shake=1.0;
      M.innerHTML='WRECKED<br>'+sc+'m<br><span style="font-size:20px">Space to restart</span>';
      M.style.display='block';
    }
    H.textContent=sc+'m  '+(spd*330|0)+' km/h  HP:'+Math.ceil(hp)+(wsOk?' 🟢'+peers.size+'p':' offline');

    // Send position to server every 3 frames
    if(wsOk&&++netTick%3===0)ws.send(JSON.stringify({t:'u',x:px,z:0,spd,hp,alive}));
  }

  // Build scene
  vi=0;
  const mo=(-dst%4+4)%4;

  // Simulate particles
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.x+=p.vx;p.y+=p.vy;p.z+=p.vz;
    p.vy-=.003; // gravity
    p.vx*=.97;p.vz*=.97;
    if(p.y<0){p.y=0;p.vy*=-.3;p.vx*=.8;p.vz*=.8;}
    p.life--;
    if(p.life<=0){parts.splice(i,1);continue;}
    const f=p.life/60,s=p.sz*(.5+f);
    bx(p.x,p.y,p.z,s,s,s, p.r*f,p.g*f,p.b*f);
  }

  q(-60,0,10,60,0,10,60,0,-RL,-60,0,-RL, .22,.45,.18);           // ground
  q(-RW,.01,10,RW,.01,10,RW,.01,-RL,-RW,.01,-RL, .25,.25,.28);  // road (doubled)
  q(-RW-.15,.02,10,-RW,.02,10,-RW,.02,-RL,-RW-.15,.02,-RL, 1,1,1); // left edge
  q(RW,.02,10,RW+.15,.02,10,RW+.15,.02,-RL,RW,.02,-RL, 1,1,1);    // right edge

  // Median — double yellow line
  q(-.18,.025,10,-.06,.025,10,-.06,.025,-RL,-.18,.025,-RL, .95,.8,.1);
  q(.06,.025,10,.18,.025,10,.18,.025,-RL,.06,.025,-RL, .95,.8,.1);

  // Right-side lane dashes
  for(let ln=1;ln<LN;ln++){const lx=ln*LW;for(let z=mo;z<RL;z+=4)q(lx-.06,.02,-z+2,lx+.06,.02,-z+2,lx+.06,.02,-z,lx-.06,.02,-z, .9,.9,.8);}
  // Left-side lane dashes
  for(let ln=1;ln<LN;ln++){const lx=-ln*LW;for(let z=mo;z<RL;z+=4)q(lx-.06,.02,-z+2,lx+.06,.02,-z+2,lx+.06,.02,-z,lx-.06,.02,-z, .9,.9,.8);}

  for(let z=mo*2.5;z<RL;z+=12){bx(-RW-1,.6,-z,.15,1.2,.15,.7,.7,.7);bx(RW+1,.6,-z,.15,1.2,.15,.7,.7,.7);}

  car(px,0, ...myColor);     // player
  for(const t of traf)car(t.x,t.z,...t.c);
  for(const t of onc)car(t.x,t.z,...t.c,-1);
  // Render peers (relative to player's road position — they share the road)
  for(const [,p] of peers)if(p.alive)car(p.x,p.z,...p.color);

  // Draw
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.uniform1f(us,dst);
  gl.uniformMatrix4fv(uv,false,mul(persp(Math.PI/4,C.width/C.height,.1,300),look([px*.3+shake*(Math.random()-.5),4.5+shake*(Math.random()-.5)*.5,7],[px*.5,.5,-25],[0,1,0])));
  gl.bufferData(gl.ARRAY_BUFFER,VB.subarray(0,vi),gl.DYNAMIC_DRAW);
  gl.drawArrays(gl.TRIANGLES,0,vi/6);
}
reset();requestAnimationFrame(frame);
</script></body></html>
